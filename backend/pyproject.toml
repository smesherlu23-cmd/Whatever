[project]
name = "whatever-backend"
version = "0.2.0"
description = "Whatever: backend API and real-time sync"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pycrdt>=0.14.13",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # TestClient из Starlette пока работает через httpx; замена на httpx2 — отдельная задача.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT", "ASYNC", "PERF", "RUF",
    "S",    # bandit: типичные уязвимости
    "DTZ",  # datetime только с часовым поясом
    "BLE",  # никаких except Exception без нужды
    "ARG",  # неиспользуемые аргументы
    "ERA",  # закомментированный код
    "PTH",  # pathlib вместо os.path
    "PIE", "PGH", "TID", "LOG", "G", "T20",
]
# Комментарии и сообщения на русском: кириллица — не опечатка, а язык проекта.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент, а пароли и адреса — тестовые данные.
# Подменённые через monkeypatch методы повторяют сигнатуру оригинала целиком.
"tests/**" = ["S101", "S104", "S105", "S106", "ARG001"]
# Командная строка отвечает пользователю в stdout.
"app/cli.py" = ["T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "scripts", "alembic/env.py"]
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
