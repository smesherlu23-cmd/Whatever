services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatever
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatever}
      POSTGRES_DB: whatever
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatever"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      WHATEVER_DATABASE_URL: postgresql+asyncpg://whatever:${POSTGRES_PASSWORD:-whatever}@postgres:5432/whatever
      WHATEVER_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WHATEVER_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
