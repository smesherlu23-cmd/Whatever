name: CI

on:
  push:
    branches: [main]
  pull_request:

# Действия закреплены по SHA коммита, а не по тегу: тег можно передвинуть на другой код.
# Обновляет их Dependabot (.github/dependabot.yml).

# Новый пуш в ту же ветку отменяет устаревшую проверку.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatever
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: whatever
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatever"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Те же переменные, что в .env: тесты создают рядом свою базу whatever_test.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term
      - name: Migrations — upgrade, downgrade and upgrade again
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check

  frontend:
    name: Frontend (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  audit:
    name: Dependencies (known vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      # Проверяется то, что попадает в образы: зависимости без инструментов разработки.
      - name: Backend (pip-audit)
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Frontend (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (lint, build, start, health)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      # Пароль со спецсимволами проверяет, что адрес базы собирается правильно.
      - name: Configure like a server
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci/p@ss:word|' .env
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180
      # Уязвимости в собранных образах: в пакетах базового образа и в зависимостях. Падает,
      # только если для уязвимости уже есть исправление, то есть её можно устранить.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatever-backend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatever-frontend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Check the running application
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
          test "$(docker compose exec -T backend id -u)" != 0
          test "$(docker compose exec -T frontend id -u)" != 0
      # Сквозные тесты в настоящем браузере против запущенных образов. До проверки резервной
      # копии: она стирает базу, а входов вместе с тестами меньше предела nginx (10 в минуту).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: End-to-end tests (Playwright)
        env:
          E2E_ADMIN_LOGIN: e2e-admin
          E2E_ADMIN_PASSWORD: e2e-admin-password
        run: |
          printf '%s\n' "$E2E_ADMIN_PASSWORD" | docker compose exec -T backend \
            python -m app.cli create-admin "$E2E_ADMIN_LOGIN" --password-stdin
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      # Копия, сделанная сервисом backup, восстанавливается в чистую установку: без такой
      # проверки резервная копия — только надежда.
      - name: Back up, wipe and restore
        run: |
          printf 'ci-admin-password\n' | docker compose exec -T backend \
            python -m app.cli create-admin ci-admin --password-stdin
          docker compose exec -T backend sh -c 'echo picture > /var/lib/whatever/files/marker'
          make backup
          backup=$(ls backups | sed -n 's/\.dump$//p')
          docker compose down --volumes
          docker compose up --detach --wait --wait-timeout 180
          make restore BACKUP="$backup"
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error --output /dev/null \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8080' \
            -d '{"login":"ci-admin","password":"ci-admin-password"}' \
            http://localhost:8080/api/auth/login
          test "$(docker compose exec -T backend cat /var/lib/whatever/files/marker)" = picture
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
